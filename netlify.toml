[build]
  publish = "."
  functions = "netlify/functions"
  # Netlify deploys only when asked (2026-10-17): the site now deploys on Cloudflare from every push. A push builds here only
  # if its commit message contains [netlify]; otherwise the ignore command exits 0 and Netlify skips it (no credits used).
  ignore = "git log -1 --pretty=%B | grep -qF '[netlify]' && exit 1 || exit 0"
