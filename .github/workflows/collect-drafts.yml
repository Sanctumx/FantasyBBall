name: Collect ADP and drafts

# Every 6 hours: save today's Fantrax ADP and the draft results of the leagues in src/collect/leagues.txt.
# Data commits carry [skip netlify] so they don't redeploy the site.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-drafts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        working-directory: src/collect
        run: node collect.mjs || echo "::warning::Some fetches failed; saving what was collected."
      - name: Commit new data
        run: |
          git config user.name "courtside-collector"
          git config user.email "actions@users.noreply.github.com"
          git add src/collect/data
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "Collect ADP and drafts $(date -u +%F) [skip netlify]"
          git pull --rebase --autostash
          git push
