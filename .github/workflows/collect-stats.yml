name: Collect ESPN stats

# Daily: save ESPN's per-game season stats to stats/espn.json for the in-season tools. The file is only rewritten when
# ESPN has stats for the current season. Data commits carry [skip netlify] so they don't redeploy the site.
on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        run: node src/collect/espn_stats.mjs
      - name: Commit new data
        run: |
          git config user.name "courtside-collector"
          git config user.email "actions@users.noreply.github.com"
          git add stats/espn.json
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "Collect ESPN stats $(date -u +%F) [skip netlify]"
          git pull --rebase --autostash
          git push
