<title>Rankings · Courtside Draft Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one controls panel on top, one sortable player table below. Same look as the League Dashboard. */
:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --sunk:#F6F7F5; --ink:#15191B; --muted:#5D666B; --line:#D8DCD7;
  --accent:#C24E1B; --mine:#1F5FA8; --mine-soft:#DFE9F6; --good:#1A7F45; --bad:#C2372F; --warn:#A85A0D; --r:6px;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --surface:#171B1E; --sunk:#13171A; --ink:#E6E9E5; --muted:#99A2A7; --line:#2A3135;
  --accent:#EC7840; --mine:#76A9EA; --mine-soft:#1B2A3D; --good:#4BBE7C; --bad:#E86D62; --warn:#EE9A45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#171B1E; --sunk:#13171A; --ink:#E6E9E5; --muted:#99A2A7; --line:#2A3135;
  --accent:#EC7840; --mine:#76A9EA; --mine-soft:#1B2A3D; --good:#4BBE7C; --bad:#E86D62; --warn:#EE9A45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-block:20px 18px;border-bottom:2px solid var(--ink);margin-bottom:16px}
header.top h1{display:flex;align-items:center;gap:.28em;font:700 3.4rem/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:0}
header.top h1 .logo{width:.9em;height:.9em;flex:none}
header.top h1{flex-wrap:wrap;row-gap:0}header.top h1 .pg{font-size:.55em;opacity:.6;margin-left:.15em;align-self:flex-end;padding-bottom:.12em}
header.top .top-r{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-right:24px}
@media (max-width:640px){header.top h1{font-size:2.4rem}header.top .top-r{margin-right:0}}
main{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.ctl{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.f select{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:9em;max-width:100%;font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--ink)}
#src{min-width:15em}
.f input[type=text]{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:11em;font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.row2{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end}
.posf,.wts{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;border:0;margin:0;padding:0 0 2px}
.posf legend,.wts legend{float:left;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px;padding:0}
.posf label{position:relative;cursor:pointer}
.posf input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.posf span{display:inline-block;font:500 .8rem/1 var(--f-data);padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);color:var(--muted)}
.posf input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.posf input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.wts label{display:flex;align-items:center;gap:3px;font:500 .76rem var(--f-data)}
.wts select{width:4.2rem;padding:3px 2px;font-size:.76rem;background:var(--sunk);border:1px solid var(--line);border-radius:4px}
.wts select.off{color:var(--bad);border-color:var(--bad)}
.wts select.chg{border-color:var(--accent)}
th.punted{text-decoration:line-through;opacity:.6}
td.punted{opacity:.35}
.msg{margin:0;font-size:.9rem;color:var(--muted)}
.msg:empty{display:none}
.msg.err{color:var(--bad)}
.msgrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msgrow:has(.msg:empty):has(.retry[hidden]){display:none}
.retry,.btn{border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover,.retry:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:.82rem;margin:0}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;font:12.5px/1.3 var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap;width:100%}
th,td{padding:3px 5px;text-align:center;border-bottom:1px solid var(--line)}
th{font:600 .72rem/1.15 var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-block:7px;border-bottom:1px solid var(--ink);cursor:pointer;user-select:none}
th:hover,th[aria-sort]{color:var(--ink)}
th[aria-sort="descending"]::after{content:" ▼";font-size:.6rem}
th[aria-sort="ascending"]::after{content:" ▲";font-size:.6rem}
td.l,th.l{text-align:left}
td.l{font:13px var(--f-body);padding-right:10px}
td.dim{color:var(--muted)}
tbody tr:hover td{background:var(--sunk)}
tbody tr.mine td{background:var(--mine-soft)}
tbody tr.mine:hover td{background:var(--sunk)}
.chip{display:inline-block;min-width:3.4em;padding:2px 5px;border-radius:4px;font-weight:500;text-align:center;line-height:1.3}
.chip.b{font-weight:700}
</style>

<header class="top">
  <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#EC7840"/><g fill="none" stroke="#15191B" stroke-width="4.2" stroke-linecap="round"><path d="M32 2v60M2 32h60"/><path d="M12 10c8 6 8 38 0 44M52 10c-8 6-8 38 0 44"/></g></svg><span class="wm">Courtside</span><span class="pg">Rankings</span></h1>
  <div class="top-r"><span id="sitenav"></span></div>
</header>

<main>
  <section class="panel" aria-label="Rankings controls">
    <div class="ctl">
      <label class="f" for="q">Find player<input type="text" id="q" placeholder="Name or team" autocomplete="off"></label>
      <label class="f" for="src">Source<select id="src" title="Season to date and the recent-games windows average the 2026-27 box scores; Projections use the board's projections.">
        <option value="season">Season to date</option>
        <optgroup label="Recent games"><option value="w7">Last week</option><option value="w14">Last 2 weeks</option><option value="w30">Last month</option></optgroup>
        <optgroup label="Projections"><option value="avg">Average</option><option value="bbm">BBM</option><option value="hs">Hashtag</option></optgroup></select></label>
      <label class="f" for="type">Zscore type<select id="type" title="Standard: plain z-scores. H2H-Adjusted: in units of a weekly head-to-head gap. ROTO-Adjusted: in units of the team spread."><option value="classic">Standard</option><option value="h2h">H2H-Adjusted</option><option value="adj">ROTO-Adjusted</option></select></label>
      <label class="f" for="basis" title="Season counts games played; Per game ignores games missed; Mix is halfway.">Basis<select id="basis"><option value="pergame">Per game</option><option value="total">Season</option><option value="mix">Mix</option></select></label>
      <label class="f" for="zdrop" title="Discount each player's worst one (−1) or two (−2) categories"><span>Zscore</span><select id="zdrop"><option value="0,0">Normal</option><option value="1,50">−1 50%</option><option value="1,0">−1 100%</option><option value="2,50">−2 50%</option><option value="2,0">−2 100%</option></select></label>
      <label class="f" for="show" title="How many players to list"><span>Show</span><select id="show"><option value="25">Top 25</option><option value="50">Top 50</option><option value="100">Top 100</option><option value="150">Top 150</option><option value="200">Top 200</option><option value="0">All</option></select></label>
      <label class="f" for="winvs" title="Replacement: the best player left once the draft ends (as on the Draft tab). Average player: the average player on your roster when a team is saved in Settings, else an average player from the Zscore pool."><span>Win vs</span><select id="winvs"><option value="rep">Replacement</option><option value="avg">Average player</option></select></label>
      <label class="f" for="myteam" title="The team Win is measured for: its players fill the slots and a new player takes the spot of its weakest. Starts as the team saved in Settings; No team measures against an empty draft."><span>My team</span><select id="myteam"><option value="none">No team</option></select></label>
      <label class="f" for="orderby" title="What the # rank means; picking one also sorts by it. Clicking a column header only re-sorts the rows."><span>Order by</span><select id="orderby"><option value="z">Zscore</option><option value="winC">Win C</option><option value="winM">Win M</option></select></label>
      <label class="f" for="stats">Stats<select id="stats"><option value="z">Zscore</option><option value="raw">Raw</option></select></label>
      <label class="f" for="poboost" hidden title="Boost players whose teams play more games in your playoff weeks (Settings)">Playoff boost<select id="poboost"><option value="off">Off</option><option value="light">Light</option><option value="medium">Medium</option><option value="strong">Strong</option><option value="vstrong">Very strong</option></select></label>
      <button type="button" class="btn" id="hide" aria-pressed="false" title="Needs a league loaded in Settings">Hide taken</button>
    </div>
    <div class="row2">
      <fieldset class="posf" id="posf"><legend>Position</legend><label for="pf-PG"><input type="checkbox" id="pf-PG" value="PG"><span>PG</span></label><label for="pf-SG"><input type="checkbox" id="pf-SG" value="SG"><span>SG</span></label><label for="pf-SF"><input type="checkbox" id="pf-SF" value="SF"><span>SF</span></label><label for="pf-PF"><input type="checkbox" id="pf-PF" value="PF"><span>PF</span></label><label for="pf-C"><input type="checkbox" id="pf-C" value="C"><span>C</span></label></fieldset>
      <fieldset class="wts" id="catw" title="Category weights in Zscore (×0 punts it)"><legend>Weights</legend><label for="cw-0"><span>FG%</span><select id="cw-0" data-c="0"></select></label><label for="cw-1"><span>FT%</span><select id="cw-1" data-c="1"></select></label><label for="cw-2"><span>3PM</span><select id="cw-2" data-c="2"></select></label><label for="cw-3"><span>PTS</span><select id="cw-3" data-c="3"></select></label><label for="cw-4"><span>REB</span><select id="cw-4" data-c="4"></select></label><label for="cw-5"><span>AST</span><select id="cw-5" data-c="5"></select></label><label for="cw-6"><span>STL</span><select id="cw-6" data-c="6"></select></label><label for="cw-7"><span>BLK</span><select id="cw-7" data-c="7"></select></label><label for="cw-8"><span>TO</span><select id="cw-8" data-c="8"></select></label><button type="button" class="btn" id="cw-reset" style="padding:3px 8px">Reset</button></fieldset>
    </div>
    <div class="msgrow"><p class="msg" id="msg" role="status"></p><button type="button" class="retry" id="retry" hidden>Retry</button></div>
    <p class="hint" id="note"></p>
  </section>

  <section class="panel">
    <div class="scroll"><table id="tbl"></table></div>
  </section>
</main>

<script>/*__SHARED__*/</script>

<script>/*__RANKINGS__*/</script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id), LS = LeagueStore, R = Rankings, InL = InLeague;
  document.getElementById('sitenav').outerHTML = Shared.TOOLBAR_HTML('rankings');
  { const st = document.createElement('style'); st.textContent = Shared.TOOLBAR_CSS; document.head.appendChild(st); }
  const KEY = 'courtside-rankings-v1', CATN = ['FG%', 'FT%', '3PM', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TO'], RAWK = ['fgp', 'ftp', 'tpm', 'pts', 'reb', 'ast', 'stl', 'blk', 'to'];
  const POS = ['PG', 'SG', 'SF', 'PF', 'C'], CWV = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
  let ui = { src: 'season', type: 'classic', basis: 'pergame', stats: 'z', poboost: 'off', zdrop: '0,0', winvs: 'rep', show: 0, pos: [], cw: null, hide: false, sort: 'z', order: 'z', dir: -1, team: null };
  try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const oneOf = (v, l, d) => l.includes(v) ? v : d;
  ui.src = oneOf(ui.src, ['season', 'w7', 'w14', 'w30', 'avg', 'bbm', 'hs'], 'season'); ui.type = oneOf(ui.type, R.TYPES, 'classic'); ui.basis = oneOf(ui.basis, ['pergame', 'total', 'mix'], 'pergame');
  ui.stats = oneOf(ui.stats, ['z', 'raw'], 'z'); ui.dir = ui.dir === 1 ? 1 : -1; ui.winvs = oneOf(ui.winvs, ['rep', 'avg'], 'rep'); ui.zdrop = oneOf(ui.zdrop, ['0,0', '1,50', '1,0', '2,50', '2,0'], '0,0'); ui.show = oneOf(+ui.show, [0, 25, 50, 100, 150, 200], 0); ui.pos = Array.isArray(ui.pos) ? ui.pos.filter(x => POS.includes(x)) : [];
  ui.cw = Array.isArray(ui.cw) && ui.cw.length === 9 && ui.cw.every(v => CWV.includes(+v)) ? ui.cw.map(Number) : R.WEIGHTS.slice(); let query = '';
  ui.poboost = 'off';   // control hidden for now (user, 2026-10-21); Win columns ignore it
  ui.team = typeof ui.team === 'string' ? ui.team : null; ui.hide = !!ui.hide; ui.order = oneOf(ui.order, ['z', 'winC', 'winM'], 'z'); ui.sort = oneOf(String(ui.sort), ['z', 'n', 'own', 't', 'pos', 'm', 'po', 'gp', 'winC', 'winM', 'edge', '0', '1', '2', '3', '4', '5', '6', '7', '8'], 'z');
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ui)); } catch (e) {} };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const say = (t, err) => { $('msg').textContent = t || ''; $('msg').className = 'msg' + (err ? ' err' : ''); };
  const sayHtml = h => { $('msg').innerHTML = h; $('msg').className = 'msg'; };
  let SS = LS.load(LS.local.get), box = [], fxPlayers = null, rosters = null, teamName = {}, fxTimer = null, fxWait = 0, loadSeq = 0;
  const cache = new Map();   // source rows and tables, by key

  async function fxGet(what, id) {
    let r; try { r = await fetch('api/fantrax?what=' + what + (id ? '&leagueId=' + encodeURIComponent(id) : ''), { cache: 'no-store' }); } catch (e) { throw new Error('offline'); }
    const type = r.headers.get('content-type') || ''; if (!type.includes('json')) throw new Error('nohost');
    let body; try { body = await r.json(); } catch (e) { throw new Error('nohost'); }
    if (r.status === 404 && !(body && body.error)) throw new Error('nohost');
    if (!r.ok || body.error) { const er = new Error(body.error || ('Fantrax answered ' + r.status)); er.status = r.status; throw er; }
    return body;
  }
  const transient = e => e.message === 'offline' || e.status === 429 || e.status >= 500;

  // monthly box-score files (stats/box-YYYY-MM.json) from the season's first month to this month; missing months are skipped
  async function loadBox() {
    const out = [], now = new Date(); let y = 2026, m = 10;
    while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth() + 1)) {
      try { const r = await fetch('stats/box-' + y + '-' + String(m).padStart(2, '0') + '.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (j && j.games) out.push(j); } } catch (e) {}
      if (++m > 12) { m = 1; y++; }
    }
    return out;
  }
  const WINDAYS = { season: 400, w7: 7, w14: 14, w30: 30 };

  // the league loaded in Settings: owners come from its current rosters; the table works without it
  async function loadLeague() {
    const seq = ++loadSeq, lg = SS.league; clearTimeout(fxTimer); rosters = null; teamName = {}; owned.key = ''; $('retry').hidden = true;
    if (LS.isPoints(SS.settings)) { sayHtml(LS.POINTS_NOTE_HTML); draw(); return; }
    if (!lg) { sayHtml('Load a league in <a href="settings.html">Settings</a> to see owners and hide taken players.'); draw(); return; }
    say('Loading ' + (lg.name || lg.id) + ' from Fantrax…');
    try {
      const league = await fxGet('league', lg.id), ros = await fxGet('rosters', lg.id);
      if (!fxPlayers) fxPlayers = await fxGet('players');
      if (seq !== loadSeq) return;
      const L = InL.parseLeague(league); L.teams.forEach(t => { teamName[t.id] = t.name; });
      rosters = InL.parseRosters(ros); fxWait = 0; say('');
    } catch (e) {
      if (seq !== loadSeq) return;
      $('retry').hidden = false;
      if (e.message === 'nohost') say('Fantrax leagues load on the hosted site; owners are not shown here.', true);
      else if (transient(e)) { fxWait = Math.min(120, fxWait ? fxWait * 2 : 10); say((e.status === 429 ? 'Fantrax is busy (too many requests)' : e.message === 'offline' ? 'Couldn\'t reach the sync service' : 'Fantrax didn\'t answer') + '. Retrying in ' + fxWait + ' s…', true); fxTimer = setTimeout(() => { if (seq === loadSeq) loadLeague(); }, fxWait * 1000); }
      else say(e.message, true);
    }
    draw();
  }

  const settings = () => SS.settings;
  function windowOf(src) {
    src = src || ui.src; const k = 'win:' + src; if (!cache.has(k)) cache.set(k, R.windowSource(box, WINDAYS[src], PLAYERS));
    return cache.get(k);
  }
  function sourceRows(src) {
    src = src || ui.src; const k = 'rows:' + src; if (cache.has(k)) return cache.get(k);
    const rows = WINDAYS[src] ? windowOf(src).rows : R.projSource(PLAYERS, src);
    cache.set(k, rows); return rows;
  }
  // playoff games by team for the league's playoff weeks (Settings); recomputed only when those settings change
  const po = { key: '', pg: null };
  function playoffs() {
    const s = LS.clampPoStart(settings(), SCHED), k = [s.asb, s.poStart, s.poFmt].join('|');
    if (po.key !== k) po.pg = R.playoffGames(SCHED, s), po.key = k;
    return po.pg;
  }
  // Win C / Win M (Engine.evaluate, as on the Draft tab); with a saved team in Settings the league's rosters fill the slots
  // the team Win is measured for: its own pick here, else the Settings team (null = none)
  const myTeam = () => SS.league ? (ui.team == null ? LS.defaultTeam(LS.local.get, SS.league.id) : ui.team === 'none' ? null : ui.team) : null;
  function fillTeams() {
    const ids = rosters ? Object.keys(rosters).sort() : [], key = ids.map(id => id + teamName[id]).join('|'), sel = $('myteam');
    if (sel.dataset.key !== key) { sel.dataset.key = key; sel.innerHTML = '<option value="none">No team</option>' + ids.map(id => '<option value="' + esc(id) + '">' + esc(teamName[id] || id) + '</option>').join(''); }
    const me = myTeam(); sel.value = me != null && ids.includes(me) ? me : 'none'; sel.disabled = !ids.length;
  }
  const win = { key: '', w: null, seq: 0, mine: false, wait: false };
  function winLists(rows, tab, own, s) {
    const me = myTeam(), ids = rosters ? Object.keys(rosters).sort() : [];
    if (me == null || ids.length !== s.teams || !ids.includes(me)) return null;
    const rk = new Map(tab.filter(t => t.z != null).map((t, i) => [t.pid, i])), by = {};
    own.forEach((v, pid) => { if (v.slot !== 'IR' && rk.has(pid)) (by[v.owner] = by[v.owner] || []).push(pid); });
    return [me].concat(ids.filter(x => x !== me)).map(id => (by[id] || []).sort((a, b) => rk.get(a) - rk.get(b)).slice(0, s.roster));
  }
  function winFor(rows, tab, own) {
    const s = settings(), lists = winLists(rows, tab, own, s);
    win.mine = !!lists;
    const key = ['win', ui.src, ui.basis, WINDAYS[ui.src] ? ui.type : '', s.teams, s.roster, s.cats, s.ilSpots, lists ? lists.map(l => l.join(',')).join(';') : 'none'].join('|');
    if (win.key === key) return win.w;
    win.key = key; const seq = ++win.seq;
    win.w = R.winStart(rows, tab, { teams: s.teams, roster: s.roster, cats: s.cats, ilSpots: s.ilSpots, basis: ui.basis, lists });
    const tick = () => { if (seq !== win.seq) return; if (win.w.step() != null) { draw(); setTimeout(tick, 0); } else draw(); };
    if (win.w.pending.length) setTimeout(tick, 0);
    return win.w;
  }
  function tableFor(rows, src, type, basis) {
    src = src || ui.src; type = type || ui.type; basis = basis || ui.basis;
    const s = settings(), k = ['tab', src, type, basis, s.teams, s.roster, s.cats].join('|');
    if (!cache.has(k)) cache.set(k, R.table(rows, { teams: s.teams, roster: s.roster, cats: s.cats, type, basis }));
    return cache.get(k);
  }
  // after drawing, idle time builds the tables for the other Zscore types and bases of this source, then the other sources, so
  // changing an option is a lookup; the keys carry every input, so a change in Settings never meets a stale table
  let warmTimer = 0;
  function prewarm() {
    clearTimeout(warmTimer);
    const todo = [], BASES = ['pergame', 'total', 'mix'];
    R.TYPES.forEach(t => BASES.forEach(b => { if (t !== ui.type || b !== ui.basis) todo.push([ui.src, t, b]); }));
    ['season', 'w7', 'w14', 'w30', 'avg', 'bbm', 'hs'].forEach(src => { if (src !== ui.src) todo.push([src, ui.type, ui.basis]); });
    const next = () => { const j = todo.shift(); if (!j) return; try { const rows = sourceRows(j[0]); if (rows.length) tableFor(rows, j[0], j[1], j[2]); } catch (e) {} warmTimer = setTimeout(next, 30); };
    warmTimer = setTimeout(next, 600);
  }
  const chip = (z, sc, txt) => { const d = Math.max(-1, Math.min(1, z / sc)) * .25, t = Math.abs(d) / .25;
    const bg = Math.abs(d) < .02 ? 'transparent' : 'color-mix(in oklab, var(' + (d > 0 ? '--good' : '--bad') + ') ' + Math.round(12 + 58 * t) + '%, var(--surface))';
    return '<span class="chip" style="background:' + bg + '">' + txt + '</span>'; };
  const rawTxt = (r, c) => { const v = r.line[RAWK[c]]; return c < 2 ? v.toFixed(3).replace(/^0/, '') : v.toFixed(1); };
  const zTxt = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
  const owned = { map: new Map(), key: '' };
  function ownersFor(rows) {
    if (!rosters) return new Map();
    const k = ui.src + '|' + SS.league.id; if (owned.key !== k) owned.map = R.ownersOf(rows, fxPlayers, rosters), owned.key = k;
    return owned.map;
  }

  function draw() {
    const rows = sourceRows(), n = $('note');
    if (LS.isPoints(SS.settings)) { $('tbl').innerHTML = ''; n.textContent = ''; return; }
    fillTeams(); $('hide').disabled = !rosters; $('hide').setAttribute('aria-pressed', String(ui.hide && !!rosters));
    if (WINDAYS[ui.src] && !windowOf().rows.length) { $('tbl').innerHTML = ''; n.textContent = 'No games in the box-score files yet; the table fills in as the season is played.'; return; }
    const tab0 = tableFor(rows), tab = R.withPlayoffs(tab0, rows, playoffs(), ui.poboost), byPid = new Map(rows.map(r => [r.pid, r])), own = ownersFor(rows), W = ui.cw.slice(), s = settings();
    if (s.cats !== 9) W[8] = 0;
    syncW();
    const wn = winFor(rows, tab0, own), wv = pid => { const m = wn[ui.winvs].get(pid); return m ? (!win.mine || !wn.pending.includes(pid) ? m : null) : null; };
    // Zscore from the weighted categories; -1 / -2 take off the worst one or two (50% = half of it, 100% = all of it)
    const [zd, zp] = ui.zdrop.split(',').map(Number), keep = zp / 100;
    tab.forEach(t => { if (t.z == null) return;
      const v = t.cats.map((q, c) => q * W[c]), act = v.map((q, c) => c).filter(c => W[c] > 0).sort((a, b) => v[a] - v[b]);
      t.zw = v.reduce((a, q) => a + q, 0) - (1 - keep) * act.slice(0, zd).reduce((a, c) => a + v[c], 0); });
    const ov = t => ui.order === 'winC' ? (wv(t.pid) || {}).c : ui.order === 'winM' ? (wv(t.pid) || {}).m : t.zw;   // Win values still pending rank after the rest, by Zscore
    const ranked = tab.filter(t => t.z != null).sort((a, b) => { const x = ov(a), y = ov(b); if (x == null || y == null) return x == null && y == null ? b.zw - a.zw : x == null ? 1 : -1; return y - x || b.zw - a.zw; }); ranked.forEach((t, i) => { t.rk = i + 1; });
    // Win M rank among players that have one; Edge = Order by rank minus Win M rank (positive: Win M likes him more)
    const wmr = new Map(); ranked.filter(t => (wv(t.pid) || {}).m != null).sort((a, b) => wv(b.pid).m - wv(a.pid).m || b.zw - a.zw).forEach((t, i) => wmr.set(t.pid, i + 1));
    const edge = x => x.rank != null && wmr.has(x.r.pid) ? x.rank - wmr.get(x.r.pid) : null;
    const hide = ui.hide && !!rosters, me = rosters ? myTeam() : null;
    let list = tab.map(t => ({ t, r: byPid.get(t.pid), rank: t.z == null ? null : t.rk, own: own.get(t.pid) || null }));
    if (hide) list = list.filter(x => !x.own);
    const q = query.trim().toLowerCase();
    if (ui.pos.length) list = list.filter(x => !x.r.pos || String(x.r.pos).split('/').some(p => ui.pos.includes(p)));   // rows with no known position (unmatched ESPN names) stay
    if (q) list = list.filter(x => String(x.r.n).toLowerCase().includes(q) || String(x.r.t).toLowerCase() === q);
    // colour scale per category: the 90th percentile of |weighted z| inside the pool
    const sc = CATN.map((_, c) => { const a = tab.filter(t => t.inPool).map(t => Math.abs(t.cats[c] * W[c])).sort((p, q) => p - q); return Math.max(.3, a[Math.floor(a.length * .9)] || 1); });
    const val = (x, k) => k === 'z' ? x.t.zw : k === 'n' ? x.r.n : k === 't' ? x.r.t : k === 'pos' ? x.r.pos : k === 'm' ? x.r.m : k === 'own' ? (x.own ? (teamName[x.own.owner] || x.own.owner) : '') : k === 'gp' ? (x.r.gp != null ? x.r.gp : x.r.g) : k === 'po' ? x.t.po : k === 'winC' ? (wv(x.r.pid) || {}).c : k === 'winM' ? (wv(x.r.pid) || {}).m : k === 'edge' ? edge(x)
      : x.t.z == null ? null : (ui.stats === 'raw' ? (k === 8 ? -x.r.line.to : x.r.line[RAWK[k]]) : x.t.cats[k] * W[k]);
    const k = ui.sort === 'z' || isNaN(+ui.sort) ? ui.sort : +ui.sort, str = typeof val(list[0] || { t: { z: 0 }, r: { n: '', t: '', pos: '', line: {} }, own: null }, k) === 'string';
    list.sort((a, b) => { const x = val(a, k), y = val(b, k); if (x == null || y == null) return x == null ? (y == null ? 0 : 1) : -1;
      return (str ? String(x).localeCompare(String(y)) : x - y) * ui.dir || (a.rank || 1e9) - (b.rank || 1e9); });
    const matched = list.length; if (ui.show) list = list.slice(0, ui.show);
    const wsc = f => { const a = [...wn[ui.winvs].values()].map(v => Math.abs(v[f])).sort((p, q) => p - q); return Math.max(1, a[Math.floor(a.length * .9)] || 1); }, wS = { c: wsc('c'), m: wsc('m') };
    const wTd = (pid, f) => { const m = wv(pid); if (!m) return '<td class="dim">' + (wn.rep.has(pid) ? '…' : '—') + '</td>'; return '<td>' + chip(m[f], wS[f], (m[f] > 0.05 ? '+' : '') + (m[f] < 0 ? '−' : '') + Math.abs(m[f]).toFixed(1)) + '</td>'; };
    const th = (key, label, cls, tip) => '<th data-k="' + key + '"' + (cls ? ' class="' + cls + '"' : '') + (tip ? ' title="' + tip + '"' : '') + (String(ui.sort) === String(key) ? ' aria-sort="' + (ui.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' + label + '</th>';
    const head = '<thead><tr><th data-nosort style="cursor:default">#</th>' + th('edge', 'Edge', '', 'Order by rank minus Win M rank: positive means Win M ranks him higher than the # column does') + th('n', 'Player', 'l') + (rosters ? th('own', 'Owner', 'l') : '') + th('t', 'Team') + th('pos', 'Pos') + th('m', 'MPG', '', 'Minutes per game') + th('po', 'Playoff games') + th('gp', 'Games') + th('z', zd ? '−' + zd + ' ' + (100 - zp) + '% Zscore' : 'Zscore') + th('winC', 'Win C', '', 'Category wins added, in hundredths of a win, ' + (ui.winvs === 'avg' ? 'over an average player' : 'over a replacement-level player (as on the Draft tab)')) + th('winM', 'Win M', '', 'Matchup win chance added, in points, ' + (ui.winvs === 'avg' ? 'over an average player' : 'over a replacement-level player (as on the Draft tab)')) + CATN.map((c, i) => th(i, c, W[i] === 0 ? 'punted' : '')).join('') + '</tr></thead>';
    const body = '<tbody>' + list.map(x => {
      const z = x.t.z, cells = CATN.map((_, c) => z == null ? '<td class="dim">—</td>' : '<td' + (W[c] === 0 ? ' class="punted"' : '') + '>' + (ui.stats === 'raw' ? rawTxt(x.r, c) : chip(x.t.cats[c] * W[c], sc[c], zTxt(x.t.cats[c] * W[c]))) + '</td>').join('');
      return '<tr' + (me != null && x.own && x.own.owner === me ? ' class="mine"' : '') + '><td class="dim">' + (x.rank == null ? '—' : x.rank) + '</td>' + '<td>' + (edge(x) == null ? '<span class="dim">—</span>' : (edge(x) > 0 ? '+' : edge(x) < 0 ? '−' : '') + Math.abs(edge(x))) + '</td>' + '<td class="l">' + esc(x.r.n) + '</td>' + (rosters ? '<td class="l' + (x.own ? '' : ' dim') + '">' + (x.own ? esc(teamName[x.own.owner] || x.own.owner) + (x.own.slot === 'IR' ? ' (IR)' : '') : 'Free agent') + '</td>' : '') + '<td>' + esc(x.r.t) + '</td><td>' + (esc(x.r.pos) || '—') + '</td><td>' + (x.r.m > 0 ? x.r.m.toFixed(1) : '—') + '</td><td title="' + (x.t.per ? 'Per round: ' + x.t.per.join(' / ') : '') + '">' + (x.t.po == null ? '—' : x.t.po) + '</td><td>' + (x.r.gp != null ? x.r.gp : Math.round(x.r.g)) + '</td>'
        + '<td><b>' + (z == null ? '—' : zTxt(x.t.zw)) + '</b></td>' + wTd(x.r.pid, 'c') + wTd(x.r.pid, 'm') + cells + '</tr>'; }).join('') + '</tbody>';
    $('tbl').innerHTML = head + body;
    const K = s.teams * s.roster;
    n.textContent = (matched < tab.length ? matched + ' players match. ' : '') + 'Win C / Win M are season-long, as on the Draft tab, against simulated league teams' + (win.mine ? '; a player takes the spot of your weakest player, and your own players show what replacing them would cost' : (SS.league && rosters && Object.keys(rosters).length !== s.teams ? '; the league has ' + Object.keys(rosters).length + ' teams but Settings says ' + s.teams + ', so no roster is used' : '; add a team in Settings to measure against your roster')) + '. ' + (WINDAYS[ui.src] ? (ui.src === 'season' ? 'Season to date: ' : '') + 'games ' + windowOf().from + ' to ' + windowOf().to + ' (box scores, per-game averages)' : 'Projections') + '. Zscore is calculated on the top ' + K + ' players by H2H-adjusted value (' + s.teams + ' teams × ' + s.roster + ' players).' + (ui.poboost !== 'off' ? ' Playoff boost scales Zscore and each category by 1 + strength × (playoff games of his team ÷ the average − 1), kept within ×0.5–×1.5; the pool is chosen before it.' : '');
    prewarm();
  }

  const cwSel = [...document.querySelectorAll('#catw select')];
  cwSel.forEach(el => { el.innerHTML = CWV.map(v => '<option value="' + v + '"' + (v === 0 ? ' title="Punt"' : '') + '>×' + v + '</option>').join(''); });
  function syncW() { cwSel.forEach(el => { const c = +el.dataset.c, v = ui.cw[c]; el.value = String(v); el.className = v === 0 ? 'off' : v !== R.WEIGHTS[c] ? 'chg' : ''; el.disabled = c === 8 && settings().cats === 8; }); }
  function sync() { $('orderby').value = ui.order; $('zdrop').value = ui.zdrop; $('winvs').value = ui.winvs; $('show').value = String(ui.show); document.querySelectorAll('#posf input').forEach(i => { i.checked = ui.pos.includes(i.value); }); syncW(); $('src').value = ui.src; $('type').value = ui.type; $('basis').value = ui.basis; $('stats').value = ui.stats; $('poboost').value = ui.poboost; }
  [['src', 'src'], ['type', 'type'], ['basis', 'basis'], ['stats', 'stats'], ['poboost', 'poboost']].forEach(([id, k]) => $(id).addEventListener('change', () => { ui[k] = $(id).value; save(); draw(); }));
  $('orderby').addEventListener('change', () => { ui.order = $('orderby').value; ui.sort = ui.order; ui.dir = -1; save(); draw(); });
  $('myteam').addEventListener('change', () => { ui.team = $('myteam').value; save(); draw(); });
  [['zdrop', v => v], ['winvs', v => v], ['show', Number]].forEach(([id, f]) => $(id).addEventListener('change', () => { ui[id] = f($(id).value); save(); draw(); }));
  $('q').addEventListener('input', () => { query = $('q').value; draw(); });
  $('posf').addEventListener('change', () => { ui.pos = [...document.querySelectorAll('#posf input:checked')].map(i => i.value); save(); draw(); });
  $('catw').addEventListener('change', e => { const el = e.target.closest('select'); if (!el) return; ui.cw[+el.dataset.c] = +el.value; syncW(); save(); draw(); });
  $('cw-reset').addEventListener('click', () => { ui.cw = R.WEIGHTS.slice(); syncW(); save(); draw(); });
  $('hide').addEventListener('click', () => { if (!rosters) return; ui.hide = !ui.hide; save(); draw(); });
  $('retry').addEventListener('click', () => { fxWait = 0; loadLeague(); });
  $('tbl').addEventListener('click', e => {
    const h = e.target.closest('th[data-k]'); if (!h) return;
    const k = h.dataset.k; if (String(ui.sort) === k) ui.dir = -ui.dir; else { ui.sort = k; ui.dir = (k === 'n' || k === 't' || k === 'pos' || k === 'own') ? 1 : -1; }
    save(); draw();
  });
  window.addEventListener('storage', () => {
    const was = SS.league && SS.league.id, pts = LS.isPoints(SS.settings), s0 = JSON.stringify(SS.settings), me0 = was ? LS.defaultTeam(LS.local.get, was) : null; SS = LS.load(LS.local.get);
    if ((SS.league && SS.league.id) !== was || LS.isPoints(SS.settings) !== pts) loadLeague(); else if (JSON.stringify(SS.settings) !== s0 || (was && LS.defaultTeam(LS.local.get, was) !== me0)) draw();
  });
  sync();
  loadBox().then(b => { box = b; draw(); loadLeague(); });
})();
</script>
